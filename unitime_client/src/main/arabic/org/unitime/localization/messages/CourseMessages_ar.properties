distributionStructureDescriptionPairwise=\u064A\u062A\u0645 \u0625\u0646\u0634\u0627\u0621 \u0642\u064A\u062F \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0628\u064A\u0646 \u0643\u0644 \u0632\u0648\u062C \u0645\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0641\u064A \u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0627\u0644\u0645\u062D\u062F\u062F\u0629. \u0648\u0644\u0630\u0644\u0643\u060C \u0625\u0630\u0627 \u0643\u0627\u0646\u062A \u0647\u0646\u0627\u0643 \u0641\u0626\u0627\u062A n \u0641\u064A \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u0629\u060C \u0641\u0633\u064A\u062A\u0645 \u0646\u0634\u0631 \u0642\u064A\u0648\u062F n(n-1)/2 \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A. \u0644\u0627 \u064A\u0646\u0628\u063A\u064A \u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0647\u0630\u0647 \u0627\u0644\u0628\u0646\u064A\u0629 \u0645\u0639 \u0627\u0644\u062A\u0641\u0636\u064A\u0644\u0627\u062A "\u0627\u0644\u0645\u0637\u0644\u0648\u0628\u0629" \u0623\u0648 "\u0627\u0644\u0645\u062D\u0638\u0648\u0631\u0629" \u0639\u0644\u0649 \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u062D\u062A\u0648\u064A \u0639\u0644\u0649 \u0623\u0643\u062B\u0631 \u0645\u0646 \u0639\u062F\u062F \u0642\u0644\u064A\u0644 \u0645\u0646 \u0627\u0644\u0641\u0626\u0627\u062A.
