distributionStructureDescriptionAllClasses=\u0633\u064A\u062A\u0645 \u062A\u0637\u0628\u064A\u0642 \u0627\u0644\u0642\u064A\u062F \u0639\u0644\u0649 \u0643\u0627\u0641\u0629 \u0627\u0644\u0641\u0626\u0627\u062A \u0641\u064A \u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0627\u0644\u0645\u062D\u062F\u062F\u0629. \u0639\u0644\u0649 \u0633\u0628\u064A\u0644 \u0627\u0644\u0645\u062B\u0627\u0644\u060C \u064A\u0633\u0639\u0649 \u0642\u064A\u062F \u0627\u0644\u0639\u0648\u062F\u0629 \u0625\u0644\u0649 \u0627\u0644\u062E\u0644\u0641 \u0628\u064A\u0646 \u062B\u0644\u0627\u062B \u0641\u0626\u0627\u062A \u0625\u0644\u0649 \u0648\u0636\u0639 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u062B\u0644\u0627\u062B\u0629 \u0628\u0627\u0644\u062A\u0633\u0644\u0633\u0644 \u0641\u064A \u0627\u0644\u0648\u0642\u062A \u0627\u0644\u0645\u0646\u0627\u0633\u0628 \u0628\u062D\u064A\u062B \u0644\u0627 \u062A\u0648\u062C\u062F \u0623\u0648\u0642\u0627\u062A \u0645\u062A\u062F\u0627\u062E\u0644\u0629 \u0644\u0644\u0641\u0635\u0644 (\u064A\u062A\u0645 \u0623\u062E\u0630 \u0648\u0642\u062A \u0627\u0644\u0627\u0646\u062A\u0642\u0627\u0644 \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0641\u064A \u0627\u0644\u0627\u0639\u062A\u0628\u0627\u0631\u060C \u0639\u0644\u0649 \u0633\u0628\u064A\u0644 \u0627\u0644\u0645\u062B\u0627\u0644\u060C \u0625\u0630\u0627 \u0627\u0646\u062A\u0647\u0649 \u0627\u0644\u0641\u0635\u0644 \u0627\u0644\u0623\u0648\u0644 \u0639\u0646\u062F \u0627\u0644\u0633\u0627\u0639\u0629 8\:20\u060C \u064A\u062C\u0628 \u0623\u0646 \u064A\u0628\u062F\u0623 \u0627\u0644\u0641\u0635\u0644 \u0627\u0644\u062B\u0627\u0646\u064A \u0639\u0646\u062F \u0627\u0644\u0633\u0627\u0639\u0629 8\:30).
# Default: The distribution constraint is created between classes in one scheduling subpart and the appropriate class(es) in one or more other subparts. This structure links child and parent classes together if subparts have been grouped. Otherwise the first class in one subpart is linked to the the first class in the second subpart, etc.
distributionStructureDescriptionProgressive=\u064A\u062A\u0645 \u0625\u0646\u0634\u0627\u0621 \u0642\u064A\u062F \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0641\u064A \u062C\u0632\u0621 \u0641\u0631\u0639\u064A \u0648\u0627\u062D\u062F \u0644\u0644\u062C\u062F\u0648\u0644\u0629 \u0648\u0627\u0644\u0641\u0626\u0629 (\u0627\u0644\u0641\u0626\u0627\u062A) \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629 \u0641\u064A \u062C\u0632\u0621 \u0641\u0631\u0639\u064A \u0648\u0627\u062D\u062F \u0623\u0648 \u0623\u0643\u062B\u0631. \u064A\u0631\u0628\u0637 \u0647\u0630\u0627 \u0627\u0644\u0647\u064A\u0643\u0644 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u062A\u0627\u0628\u0639\u0629 \u0648\u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u0623\u0635\u0644\u064A\u0629 \u0645\u0639\u064B\u0627 \u0625\u0630\u0627 \u062A\u0645 \u062A\u062C\u0645\u064A\u0639 \u0627\u0644\u0623\u062C\u0632\u0627\u0621 \u0627\u0644\u0641\u0631\u0639\u064A\u0629. \u0648\u0628\u062E\u0644\u0627\u0641 \u0630\u0644\u0643\u060C \u064A\u062A\u0645 \u0631\u0628\u0637 \u0627\u0644\u0641\u0626\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0641\u064A \u062C\u0632\u0621 \u0641\u0631\u0639\u064A \u0648\u0627\u062D\u062F \u0628\u0627\u0644\u0641\u0626\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0641\u064A \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0641\u0631\u0639\u064A \u0627\u0644\u062B\u0627\u0646\u064A\u060C \u0648\u0645\u0627 \u0625\u0644\u0649 \u0630\u0644\u0643.
