distributionStructureDescriptionGroupsOfFour=\u064A\u062A\u0645 \u062A\u0637\u0628\u064A\u0642 \u0642\u064A\u062F \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0641\u0642\u0637 \u0639\u0644\u0649 \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u0627\u062A \u0627\u0644\u0641\u0631\u0639\u064A\u0629 \u0627\u0644\u062A\u064A \u062A\u062D\u062A\u0648\u064A \u0639\u0644\u0649 \u0623\u0631\u0628\u0639 \u0641\u0626\u0627\u062A \u0641\u064A \u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0627\u0644\u0645\u062D\u062F\u062F\u0629.  \u064A\u062A\u0645 \u0646\u0634\u0631 \u0627\u0644\u0642\u064A\u062F \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u0623\u0631\u0628\u0639 \u0627\u0644\u0623\u0648\u0644\u0649 (\u0628\u0627\u0644\u062A\u0631\u062A\u064A\u0628 \u0627\u0644\u0645\u0630\u0643\u0648\u0631)\u060C \u062B\u0645 \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u0623\u0631\u0628\u0639 \u0627\u0644\u062B\u0627\u0646\u064A\u0629\u060C \u0648\u0645\u0627 \u0625\u0644\u0649 \u0630\u0644\u0643.
# Default: The distribution constraint is applied only on subsets containing five classes in the selected distribution set.  A constraint is posted between the first five classes (in the order listed), then between the second five classes, etc.
distributionStructureDescriptionGroupsOfFive=\u064A\u062A\u0645 \u062A\u0637\u0628\u064A\u0642 \u0642\u064A\u062F \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0641\u0642\u0637 \u0639\u0644\u0649 \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u0627\u062A \u0627\u0644\u0641\u0631\u0639\u064A\u0629 \u0627\u0644\u062A\u064A \u062A\u062D\u062A\u0648\u064A \u0639\u0644\u0649 \u062E\u0645\u0633 \u0641\u0626\u0627\u062A \u0641\u064A \u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u062A\u0648\u0632\u064A\u0639 \u0627\u0644\u0645\u062D\u062F\u062F\u0629.  \u064A\u062A\u0645 \u0646\u0634\u0631 \u0627\u0644\u0642\u064A\u062F \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u062E\u0645\u0633 \u0627\u0644\u0623\u0648\u0644\u0649 (\u0628\u0627\u0644\u062A\u0631\u062A\u064A\u0628 \u0627\u0644\u0645\u0630\u0643\u0648\u0631)\u060C \u062B\u0645 \u0628\u064A\u0646 \u0627\u0644\u0641\u0626\u0627\u062A \u0627\u0644\u062E\u0645\u0633 \u0627\u0644\u062B\u0627\u0646\u064A\u0629\u060C \u0648\u0645\u0627 \u0625\u0644\u0649 \u0630\u0644\u0643.
